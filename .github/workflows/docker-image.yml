name: CI (lint, test, build, push GHCR)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        # The alarmdecoder pin is on a private repo; ALARMDECODER_TOKEN is a
        # repo-scoped read token for kars85/alarmdecoder.
        run: |
          pip install -r requirements-test.txt 'paho-mqtt>=2,<3' 'pyyaml>=6'
          pip install "alarmdecoder @ git+https://x-access-token:${{ secrets.ALARMDECODER_TOKEN }}@github.com/kars85/alarmdecoder@1.14.0"

      - name: Lint
        run: ruff check ad_mqtt tests run.py

      - name: Test
        run: python -m unittest discover -s tests -v

  docker:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kars85/ad-mqtt:${{ github.sha }}
            ghcr.io/kars85/ad-mqtt:latest
          secrets: |
            git_token=${{ secrets.ALARMDECODER_TOKEN }}
